<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<title>Mendel — Quiz de chimie</title>
<meta name="description" content="Quiz de chimie : symboles des éléments chimiques et formules des ions polyatomiques.">
<meta name="theme-color" content="#1565C0">
<meta name="color-scheme" content="light">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Ecran d'accueil iOS: sans ces balises, Safari ouvre la page dans un
     onglet au lieu de la lancer en plein ecran. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mendel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<!-- Le numero de version, affiche en bas de l'ecran d'accueil.
     Ecrit par tools/sync-cache-version.py, comme CACHE_VERSION dans sw.js, et
     verifie par make verify. Sans lui, impossible de distinguer un appareil
     qui tourne encore l'ancien code d'un appareil ou le correctif echoue:
     les deux affichent exactement la meme chose. -->
<meta name="app-version" content="2b24604f">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
  <span class="visually-hidden">Couper le son</span>
  <span aria-hidden="true" id="sound-icon">🔊</span>
</button>

<main class="shell">

  <!-- ---------------------------------------------------------------- -->
  <section id="screen-start" class="screen">
    <h1 class="title">Quiz de chimie</h1>
    <p class="subtitle">Choisis ta série</p>

    <div class="choices">
      <button class="button button--primary" type="button" data-topic="elements">
        Éléments chimiques
      </button>
      <button class="button button--primary" type="button" data-topic="ions">
        Ions polyatomiques
      </button>
    </div>

    <p class="hint-line">10 questions par série.</p>

    <!-- Version affichee, sur cet ecran et sur celui du resultat. Un appareil
         qui tourne encore l'ancien code affiche exactement la meme chose
         qu'un appareil ou un correctif echoue: sans ce numero, les deux sont
         indistinguables, et le depannage tourne en rond. -->
    <p class="version-line" id="version-start"></p>

    <div class="install" id="install-area" hidden>
      <button class="button button--ghost" type="button" id="install-button" hidden>
        Installer l'application
      </button>
      <p class="hint-line" id="install-hint" hidden>
        Sur iPhone : bouton Partager, puis « Sur l'écran d'accueil ».
      </p>
    </div>
  </section>

  <!-- ---------------------------------------------------------------- -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="progress-row">
      <span class="progress-text" id="progress-text"></span>
      <span class="progress-text" id="score-text"></span>
    </div>

    <hr class="rule">

    <p class="question-type" id="question-type"></p>
    <p class="prompt" id="prompt"></p>

    <!-- Le commentaire REPREND la place de l'enonce, et ne s'y ajoute pas.
         Plus bas, il poussait la zone d'action hors de l'ecran -- c'est ce qui
         le rendait invisible sur iOS, avec le bouton Suivant. A cette place
         il ne coute rien: l'enonce a disparu, donc la place est libre. Il ne
         le remplacerait pas exactement non plus, car il est plus long -- deux
         lignes de retour contre une ligne d'enonce, et trois pour une mauvaise
         reponse. Voir P2 dans le README. -->
    <p class="feedback" id="feedback" hidden aria-live="polite"></p>

    <form id="answer-form" novalidate>
      <label class="visually-hidden" for="answer-input">Ta réponse</label>
      <!-- autocapitalize="sentences" et non "off" : le clavier s'ouvre en
           majuscule puis bascule seul apres le premier caractere, ce qui
           donne "Fe" et "ClO" sans manip shift pour la premiere lettre.
           L'utilisateur remonte les majuscules suivantes lui-meme avec la
           toucheMaj. "characters" est a proscrire: il force tout en
           majuscules et produirait "FE", que la correction refuse. -->
      <input
        id="answer-input"
        class="answer-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
        spellcheck="false"
        enterkeyhint="done"
        maxlength="24"
        placeholder="">

      <!-- La barre de symboles, deroulable.
           Seule quand la reponse attendue est une formule d'ion, ou les
           indices, exposants, parentheses et chiffres sont fastidieux a
           trouver sur un clavier de telephone. 116 px: la rangee des signes
           plus celle des chiffres, la marge et l'intervalle.

           C'est la piece la plus lourde de l'ecran de quiz, et c'est ce que
           l'appareil a refuse: 116 px pour 210 px visibles sur la serie ions,
           soit plus de la moitie de la place restante. Le repli est donc
           explicite -- repliee derriere UN bouton de 48 px -- plutot que
           subi.

           Le CSS ne peut pas decider: `@media (max-height: …)` porte sur le
           viewport de MISE EN PAGE, et sur iOS il ne retrecit pas quand le
           clavier se leve. La requete ne se declenche donc jamais, ni trop
           tot ni trop tard. C'est l'appareil qui tranche, en mesurant, et c'est
           `mesurerDebordement()` qui pose `data-compact`. Voir P6 dans le
           README. -->
      <button class="symbol-toggle" id="symbol-toggle" type="button"
              aria-expanded="false" aria-controls="symbol-bar" hidden>Symboles</button>

      <!-- Le contenu du repli. Tout est insere au curseur, pas concatene a la
           fin.

           `hidden` ne depend que de `refreshSymbolZone()`: ni le balisage ni le
           CSS n'en decident seuls. Deux sources se disputeraient sinon la
           meme propriete, et la plus recente gagnerait -- donc un `hidden`
           pose par validate() serait annule par le premier rendu, ou
           l'inverse, selon l'ordre. Un seul proprietaire, et deux regles
           observables.

           Les deux premieres touches arment un mode plutot que d inserer un
           caractere: elles annoncent ce que la PROCHAINE frappe produira.
           `aria-pressed` porte l'etat du mode, lisible par un lecteur
           d'ecran; la classe `key--active` le montre a l'ecran.

           Toutes les touches d'insertion passent par la meme traduction que
           la frappe clavier: "+" et "-" honorent donc le mode arme, et
           produisent "₊" ou "⁻" plutot qu'un signe ASCII. C'est le cas le plus
           courant -- la charge d'un ion. -->
      <div class="symbol-bar" id="symbol-bar" hidden aria-label="Caractères de la formule">
        <div class="symbol-row">
          <button class="key key--script" type="button" data-script="sub"
                  aria-label="indice" aria-pressed="false"><sub>123</sub></button>
          <button class="key key--script" type="button" data-script="sup"
                  aria-label="exposant" aria-pressed="false"><sup>123</sup></button>
          <button class="key" type="button" data-insert="+" aria-label="plus">+</button>
          <button class="key" type="button" data-insert="-" aria-label="moins">-</button>
          <button class="key" type="button" data-insert="(" aria-label="parenthese ouvrante">(</button>
          <button class="key" type="button" data-insert=")" aria-label="parenthese fermante">)</button>
        </div>
        <div class="symbol-row symbol-row--digits">
          <button class="key key--digit" type="button" data-insert="0">0</button>
          <button class="key key--digit" type="button" data-insert="1">1</button>
          <button class="key key--digit" type="button" data-insert="2">2</button>
          <button class="key key--digit" type="button" data-insert="3">3</button>
          <button class="key key--digit" type="button" data-insert="4">4</button>
          <button class="key key--digit" type="button" data-insert="5">5</button>
          <button class="key key--digit" type="button" data-insert="6">6</button>
          <button class="key key--digit" type="button" data-insert="7">7</button>
          <button class="key key--digit" type="button" data-insert="8">8</button>
          <button class="key key--digit" type="button" data-insert="9">9</button>
        </div>
      </div>

    </form>
  </section>

  <!-- La mesure du debordement, lue sur l'appareil.

       Les 508 px annonces dans le CSS n'ont jamais ete mesures: c'etait un
       calcul, et un iPhone 15 Pro les a refuses. C'est exactement ce qui
       rendait le bandeau de retour et le bouton Suivant invisibles, et
       exactement ce qu'aucune assertion JS ne pouvait voir: elle verrait que
       le commentaire existe, ce qui est vrai, jamais qu'il est sous le
       clavier.

       Ce bandeau n'apparait QUE si l'ecran deborde malgre la barre
       d'action. Silencieux dans le cas normal, donc jamais encombreux, et
       impossible a ignorer quand il y a un vrai probleme. Permanent, ce
       serait du bruit qu'on arrete de lire.

       Hors de l'ecran defilant, lui aussi: un diagnostic que le debordement
       rend lui-meme inatteignable n'en serait pas un.

       Les deux chiffres bruts y sont, parce que "ca ne rentre pas" ne se
       corrige pas, et "601 px pour 508 px" se corrige. P5 dans le README. -->
  <p class="overflow-note" id="overflow-note" hidden></p>

  <!-- La zone d'action, HORS de l'ecran qui defile, et sibling des trois
       ecrans. C'est le point delicat, et la premiere version s'est trompee.

       `position: sticky` a l'interieur de l'ecran defilant NE GARANTIT RIEN.
       Un element colle ne peut se deplacer que dans la boite de son parent:
       ici, le formulaire. Si le formulaire est lui-meme plus bas que la zone
       visible -- ce qui arrive des que le contenu deborde, donc precisement
       dans le cas qu'on voulait securiser -- la barre ne peut pas remonter
       au-dessus de lui. Elle reste donc hors champ, au meme endroit qu'avant.
       Le symptome etait intact, avec une regle CSS de plus en travers.

       Enfant direct de la coque, qui est calee sur la hauteur visible et ne
       defile pas, la barre est un simple element de flex au bas de l'ecran:
       elle y reste quoi qu'il arrive du contenu. Elle ne depend plus d'une
       mesure, ni de la position d'aucun autre element. C'est la seule forme
       du probleme qui ne se repose pas sur un nombre mesure a la main.

       Elle n'apparait que sur le quiz, via `data-screen` -- le meme attribut
       que pour l'icone du son.

       `type="button"` sur les deux, et c'est volontaire: chaque source
       d'entree a son chemin. Le clic vient sur `click`, la touche retour sur
       `keydown` dans ui.js, et le gestionnaire `submit` du formulaire est
       inerte. Une soumission implicite dont iOS ne garantit pas le second
       passage n'intervient donc nulle part. Voir onKeydown(). -->

  <!-- P3 dans le README. -->
  <div class="actions" id="actions">
    <button class="button button--primary" type="button" id="validate-button">Valider</button>
    <button class="button button--primary" type="button" id="next-button" hidden></button>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <section id="screen-result" class="screen" hidden>
    <p class="result-comment" id="result-comment"></p>
    <p class="result-score" id="result-score"></p>

    <p class="version-line" id="version-result"></p>

    <div class="choices">
      <button class="button button--primary" type="button" id="restart-button">
        Une nouvelle série
      </button>
      <button class="button button--ghost" type="button" id="change-button">
        Changer de série
      </button>
    </div>
  </section>

</main>

<script type="module" src="js/ui.js"></script>
</body>
</html>
